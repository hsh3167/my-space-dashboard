name: Checks
on:
  push:
    branches: [main, feat/asset-management]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- assets/xlsx-worker.mjs
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke tests against the Pages artifact
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/myspace-http.log" 2>&1 &
          python scripts/browser-smoke.py
