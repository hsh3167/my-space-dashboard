name: Verify deployed My Space
on:
  workflow_dispatch:
    inputs:
      supabase_check:
        description: Supabase connection check (synthetic browser tests always run)
        type: choice
        options: [none, auth, schema]
        default: none
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check configured Supabase without reading financial records
        if: inputs.supabase_check != 'none'
        env:
          SUPABASE_CHECK_MODE: ${{ inputs.supabase_check }}
        run: |
          if [ "$SUPABASE_CHECK_MODE" = "auth" ]; then
            node scripts/check-supabase-connection.mjs --auth-only
          else
            node scripts/check-supabase-connection.mjs
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify public Pages with synthetic data only
        run: python scripts/browser-smoke.py https://hsh3167.github.io/my-space-dashboard
      - name: Save synthetic-data screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-browser-screenshots
          path: /tmp/myspace-browser-*/*.png
          if-no-files-found: ignore
